# Render Blueprint — deploys the Agent Haaland backend as:
#   haaland-api     web service      (FastAPI, apps/api/Dockerfile)
#   haaland-worker  background worker (same image, arq entrypoint)
#   haaland-db      managed Postgres
#   haaland-kv      managed Key Value (Redis-compatible, backs arq + vault + budget)
#
# The API image is shared by both services; only the command differs. Build
# context is the repo root because apps/api is a uv workspace member and the
# pinned lockfile lives at the root (see apps/api/Dockerfile).
#
# Migrations run in the API service's pre-deploy step, once per deploy,
# before new instances receive traffic. The worker never migrates.
# NOTE: preDeployCommand requires a paid instance type. On a free instance,
# run `alembic upgrade head` manually via an SSH/one-off shell instead.
#
# Platform constraints this deployment accepts (docs/12-render-deploy.md):
#   - No Docker socket on Render: the sandbox falls back to SubprocessRunner
#     and generated tests are reported "unrunnable" — PRs say "tests not
#     executed" instead of claiming green. Leave
#     HAALAND_ALLOW_HOST_TEST_EXECUTION unset (false): true would execute
#     model-written code inside the service container.
#   - Ephemeral disk: workspace clones are rebuilt on resume
#     (WorkspaceService.ensure) and cleaned at terminal nodes.

previews:
  generation: off

services:
  - type: web
    name: haaland-api
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    autoDeploy: true
    envVars:
      - fromGroup: haaland-shared
      - key: HAALAND_ENV
        value: prod
      - key: HAALAND_DATABASE_URL
        fromDatabase:
          name: haaland-db
          property: connectionString
      - key: HAALAND_REDIS_URL
        fromService:
          type: keyvalue
          name: haaland-kv
          property: connectionString

  - type: worker
    name: haaland-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: arq haaland.worker.WorkerSettings
    autoDeploy: true
    envVars:
      - fromGroup: haaland-shared
      - key: HAALAND_ENV
        value: prod
      - key: HAALAND_DATABASE_URL
        fromDatabase:
          name: haaland-db
          property: connectionString
      - key: HAALAND_REDIS_URL
        fromService:
          type: keyvalue
          name: haaland-kv
          property: connectionString

  - type: keyvalue
    name: haaland-kv
    plan: starter
    maxmemoryPolicy: noeviction # arq job queue + AES-GCM vault: evicting keys loses jobs/redaction maps
    ipAllowList: [] # internal connections only

databases:
  - name: haaland-db
    plan: basic-256mb
    postgresMajorVersion: "16"

# Secrets and deployment-specific config. `sync: false` means Render prompts
# for the value in the dashboard on first deploy and never stores it in git.
# config.py fails fast in prod if the required ones are missing or still
# dev defaults (HAALAND_SECRET_KEY, HAALAND_VAULT_ENCRYPTION_KEY,
# HAALAND_API_AUTH_TOKEN, HAALAND_CORS_ORIGINS).
envVarGroups:
  - name: haaland-shared
    envVars:
      - key: HAALAND_APP_BASE_URL
        sync: false
      - key: HAALAND_SECRET_KEY
        sync: false
      - key: HAALAND_VAULT_ENCRYPTION_KEY
        sync: false
      - key: HAALAND_API_AUTH_TOKEN
        sync: false
      - key: HAALAND_CORS_ORIGINS
        sync: false
      - key: HAALAND_LLM_PROVIDER
        value: deepseek
      - key: HAALAND_DEEPSEEK_API_KEY
        sync: false
      - key: HAALAND_GITHUB_AUTH_MODE
        value: app
      - key: HAALAND_GITHUB_APP_ID
        sync: false
      - key: HAALAND_GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: HAALAND_GITHUB_APP_INSTALLATION_ID
        sync: false
      - key: HAALAND_GITHUB_WEBHOOK_SECRET
        sync: false
      - key: HAALAND_NOTIFY_CHANNELS
        sync: false
      - key: HAALAND_LARK_MODE
        sync: false
      - key: HAALAND_LARK_WEBHOOK_URL
        sync: false
