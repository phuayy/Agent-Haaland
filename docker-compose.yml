services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: haaland
      POSTGRES_PASSWORD: haaland
      POSTGRES_DB: haaland
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haaland"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      HAALAND_ENV: compose
      HAALAND_DATABASE_URL: postgresql+asyncpg://haaland:haaland@postgres:5432/haaland
      HAALAND_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # DockerRunner sandbox — compose-mode only

  worker:
    build:
      context: ./apps/api
    command: ["arq", "haaland.worker.WorkerSettings"]
    env_file: .env
    environment:
      HAALAND_ENV: compose
      HAALAND_DATABASE_URL: postgresql+asyncpg://haaland:haaland@postgres:5432/haaland
      HAALAND_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
